<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 315" role="img" aria-labelledby="title desc"><title id="title">ConPose architecture</title><desc id="desc">Object detection and ROI warping feed an ROI crop and fixed edge bank into a compact CNN encoder and QRT-6D pose head that outputs object classes, bounding boxes and refined pose.</desc><rect width="1600" height="315" rx="22" fill="#fbfbf9"/><g font-family="Aptos,Segoe UI,Arial"><text x="42" y="38" font-size="21" font-weight="700" fill="#12233a">ConPose — jointly trained detection and pose</text><text x="42" y="64" font-size="13" fill="#6c7888">High-level architecture from the published framework</text><g transform="translate(42 94)"><rect x="0" y="0" width="230" height="130" rx="16" fill="#fff0e8" stroke="#e39b76" stroke-width="2"/><text x="115" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#12233a">Object detector</text><text x="115" y="62" text-anchor="middle" font-size="14" fill="#536270">feature extraction</text><text x="115" y="84" text-anchor="middle" font-size="14" fill="#536270">ROI proposals</text><text x="115" y="106" text-anchor="middle" font-size="14" fill="#536270">ROI Align</text><path d="M230 65 H290" stroke="#0b7b7f" stroke-width="4"/><polygon points="290,65 276,57 276,73" fill="#0b7b7f"/><rect x="290" y="0" width="245" height="130" rx="16" fill="#eaf4f8" stroke="#4f94c7" stroke-width="2"/><text x="412" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#12233a">ROI crop</text><text x="412" y="61" text-anchor="middle" font-size="14" fill="#536270">RGB patch</text><text x="412" y="84" text-anchor="middle" font-size="14" fill="#536270">+ fixed edge bank</text><text x="412" y="107" text-anchor="middle" font-size="13" fill="#536270">Sobel · Laplacian</text><path d="M535 65 H595" stroke="#0b7b7f" stroke-width="4"/><polygon points="595,65 581,57 581,73" fill="#0b7b7f"/><rect x="595" y="0" width="240" height="130" rx="16" fill="#eef1f6" stroke="#465d84" stroke-width="2"/><text x="715" y="39" text-anchor="middle" font-size="18" font-weight="700" fill="#12233a">Compact CNN encoder</text><text x="715" y="69" text-anchor="middle" font-size="14" fill="#536270">class-conditioned</text><text x="715" y="92" text-anchor="middle" font-size="14" fill="#536270">cross-attention</text><path d="M835 65 H895" stroke="#0b7b7f" stroke-width="4"/><polygon points="895,65 881,57 881,73" fill="#0b7b7f"/><rect x="895" y="0" width="225" height="130" rx="16" fill="#edf6ec" stroke="#72b467" stroke-width="2"/><text x="1008" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#12233a">QRT-6D head</text><text x="1008" y="67" text-anchor="middle" font-size="14" fill="#536270">rotation</text><text x="1008" y="90" text-anchor="middle" font-size="14" fill="#536270">translation</text><text x="1008" y="112" text-anchor="middle" font-size="14" fill="#536270">pose refinement</text><path d="M1120 65 H1180" stroke="#0b7b7f" stroke-width="4"/><polygon points="1180,65 1166,57 1166,73" fill="#0b7b7f"/><rect x="1180" y="0" width="290" height="130" rx="16" fill="#12233a"/><text x="1325" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Outputs</text><text x="1325" y="64" text-anchor="middle" font-size="14" fill="#dce5ed">object class · bounding box</text><text x="1325" y="88" text-anchor="middle" font-size="14" fill="#dce5ed">refined pose</text><text x="1325" y="111" text-anchor="middle" font-size="13" fill="#84d4ce">single-pass RGB inference</text></g></g></svg>