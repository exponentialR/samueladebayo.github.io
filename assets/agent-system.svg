<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
  <title id="t">Reliable agentic AI system diagram</title>
  <desc id="d">A simple diagram showing a model connected to retrieval, tools, policy controls, evaluation and human escalation.</desc>
  <rect width="640" height="360" rx="28" fill="#12233a"/>
  <g fill="none" stroke="#6fd1ca" stroke-width="2.5" opacity=".8">
    <path d="M320 180 L160 90"/><path d="M320 180 L480 90"/><path d="M320 180 L125 260"/><path d="M320 180 L515 260"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="230" y="125" width="180" height="110" rx="22" fill="#f7f9f8"/>
    <text x="320" y="170" fill="#12233a" font-size="22" font-weight="700">Agent</text>
    <text x="320" y="198" fill="#657386" font-size="15">model + state + tools</text>
    <rect x="70" y="45" width="180" height="72" rx="16" fill="#19344f" stroke="#6fd1ca"/>
    <text x="160" y="77" fill="#ffffff" font-size="17" font-weight="700">Retrieval</text>
    <text x="160" y="99" fill="#bcd5d7" font-size="13">grounded context</text>
    <rect x="390" y="45" width="180" height="72" rx="16" fill="#19344f" stroke="#6fd1ca"/>
    <text x="480" y="77" fill="#ffffff" font-size="17" font-weight="700">Tools</text>
    <text x="480" y="99" fill="#bcd5d7" font-size="13">bounded actions</text>
    <rect x="35" y="230" width="180" height="72" rx="16" fill="#19344f" stroke="#d77b56"/>
    <text x="125" y="262" fill="#ffffff" font-size="17" font-weight="700">Policy</text>
    <text x="125" y="284" fill="#e6c6b9" font-size="13">limits &amp; approvals</text>
    <rect x="425" y="230" width="180" height="72" rx="16" fill="#19344f" stroke="#d77b56"/>
    <text x="515" y="262" fill="#ffffff" font-size="17" font-weight="700">Evaluation</text>
    <text x="515" y="284" fill="#e6c6b9" font-size="13">traces &amp; regression</text>
    <rect x="240" y="286" width="160" height="48" rx="14" fill="#0b7b7f"/>
    <text x="320" y="316" fill="#ffffff" font-size="15" font-weight="700">Human escalation</text>
  </g>
  <path d="M320 235 L320 286" stroke="#6fd1ca" stroke-width="2.5"/>
</svg>
