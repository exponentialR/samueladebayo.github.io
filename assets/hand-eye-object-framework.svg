<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 320" role="img" aria-labelledby="title desc"><title id="title">Hand-Eye-Object intention inference framework</title><desc id="desc">Vision-based motion tracking feeds normalized coordinates of hands, eyes and objects into a bidirectional LSTM network for intention class prediction.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b7b7f"/></marker></defs><rect width="1400" height="320" rx="22" fill="#f8faf9"/><text x="80" y="52" font-family="Aptos,Segoe UI,Arial" font-size="24" font-weight="700" fill="#12233a">Hand-Eye-Object Tracking for Human Intention Inference</text><text x="80" y="82" font-family="Aptos,Segoe UI,Arial" font-size="14" fill="#6c7888">Framework adapted from the proposed H-E-O intention deduction pipeline</text><g font-family="Aptos,Segoe UI,Arial" text-anchor="middle"><rect x="80" y="125" width="250" height="105" rx="16" fill="#e7f3f1" stroke="#0b7b7f" stroke-width="2"/><text x="205" y="163" font-size="19" font-weight="700" fill="#12233a">Vision-based motion</text><text x="205" y="190" font-size="19" font-weight="700" fill="#12233a">tracking system</text><text x="205" y="215" font-size="13" fill="#536270">hand · gaze · objects</text><rect x="410" y="125" width="250" height="105" rx="16" fill="#fff" stroke="#c96038" stroke-width="2"/><text x="535" y="158" font-size="18" font-weight="700" fill="#12233a">Normalised coordinates</text><text x="535" y="186" font-size="18" font-weight="700" fill="#12233a">of hands, eyes</text><text x="535" y="212" font-size="18" font-weight="700" fill="#12233a">and objects</text><rect x="740" y="125" width="250" height="105" rx="16" fill="#eef1f6" stroke="#465d84" stroke-width="2"/><text x="865" y="163" font-size="19" font-weight="700" fill="#12233a">Bidirectional LSTM</text><text x="865" y="190" font-size="19" font-weight="700" fill="#12233a">deep neural network</text><text x="865" y="215" font-size="13" fill="#536270">temporal cue fusion</text><rect x="1070" y="125" width="250" height="105" rx="16" fill="#12233a"/><text x="1195" y="164" font-size="19" font-weight="700" fill="#fff">Intention class</text><text x="1195" y="191" font-size="19" font-weight="700" fill="#fff">prediction</text></g><g stroke="#0b7b7f" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M330 177 H395"/><path d="M660 177 H725"/><path d="M990 177 H1055"/></g><text x="370" y="262" font-family="Aptos,Segoe UI,Arial" font-size="12" fill="#6c7888" text-anchor="middle">Data integration</text><text x="1030" y="262" font-family="Aptos,Segoe UI,Arial" font-size="12" fill="#6c7888" text-anchor="middle">Deep learning model</text></svg>