<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc"><title id="title">SLYKLatent framework</title><desc id="desc">A two-stage gaze estimation framework with self-supervised m-BYOL pretraining followed by downstream fine-tuning using full-face and eye-patch bottleneck modules to predict a gaze vector.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#356bb8"/></marker></defs><rect width="1500" height="760" rx="22" fill="#fbfbfa"/><text x="58" y="55" font-family="Aptos,Segoe UI,Arial" font-size="28" font-weight="750" fill="#12233a">SLYKLatent</text><text x="58" y="84" font-family="Aptos,Segoe UI,Arial" font-size="15" fill="#6c7888">Self-supervised facial representation learning followed by patch-aware gaze estimation</text><g font-family="Aptos,Segoe UI,Arial"><rect x="55" y="118" width="695" height="545" rx="28" fill="#eaf2fb" stroke="#4978c7" stroke-width="3"/><text x="402" y="640" text-anchor="middle" font-size="23" font-weight="700" fill="#12233a">Self-supervised pretraining stage</text><rect x="790" y="118" width="655" height="545" rx="28" fill="#fff3cc" stroke="#7ca449" stroke-width="2"/><text x="1118" y="640" text-anchor="middle" font-size="23" font-weight="700" fill="#12233a">Downstream fine-tuning stage</text><rect x="100" y="255" width="165" height="200" rx="18" fill="#fff" stroke="#c7d3e3"/><circle cx="183" cy="327" r="45" fill="#d7e1ef"/><path d="M145 374 Q183 337 221 374" fill="#b9c8db"/><text x="183" y="488" text-anchor="middle" font-size="18" font-weight="700" fill="#12233a">Input image</text><path d="M265 355 H330" stroke="#356bb8" stroke-width="4" marker-end="url(#arr)"/><g transform="translate(335 210)"><rect x="0" y="0" width="210" height="285" rx="20" fill="#dce7f7" stroke="#7ba0d7"/><rect x="24" y="35" width="128" height="118" rx="14" fill="#fff" opacity=".75"/><rect x="42" y="52" width="128" height="118" rx="14" fill="#fff" opacity=".82"/><rect x="58" y="70" width="128" height="118" rx="14" fill="#fff"/><circle cx="122" cy="119" r="28" fill="#cad7e7"/><text x="105" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#12233a">Augmented</text><text x="105" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#12233a">input</text></g><path d="M545 355 H585" stroke="#356bb8" stroke-width="4" marker-end="url(#arr)"/><polygon points="595,255 715,300 715,410 595,455" fill="#4776c5"/><text x="655" y="365" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">m-BYOL</text><path d="M715 355 H790" stroke="#356bb8" stroke-width="4" marker-end="url(#arr)"/><text x="745" y="333" text-anchor="middle" font-size="14" fill="#536270">learned face</text><text x="745" y="351" text-anchor="middle" font-size="14" fill="#536270">representation</text><g transform="translate(835 170)"><text x="135" y="0" text-anchor="middle" font-size="20" font-weight="700" fill="#12233a">Full-face patch input</text><rect x="62" y="28" width="145" height="95" rx="10" fill="#fff" stroke="#d4c89c"/><circle cx="135" cy="70" r="27" fill="#d7e1ef"/><polygon points="220,38 278,58 278,105 220,123" fill="#6f37a5"/><text x="249" y="87" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">BNL</text></g><g transform="translate(1060 285)"><text x="95" y="0" text-anchor="middle" font-size="18" font-weight="700" fill="#12233a">Left-eye patch</text><rect x="20" y="22" width="110" height="70" rx="10" fill="#fff" stroke="#d4c89c"/><path d="M42 58 Q75 33 108 58 Q75 78 42 58" fill="#c2af9e"/><polygon points="145,22 200,42 200,88 145,108" fill="#6f37a5"/><text x="173" y="70" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">BNL</text></g><g transform="translate(1060 440)"><text x="95" y="0" text-anchor="middle" font-size="18" font-weight="700" fill="#12233a">Right-eye patch</text><rect x="20" y="22" width="110" height="70" rx="10" fill="#fff" stroke="#d4c89c"/><path d="M42 58 Q75 33 108 58 Q75 78 42 58" fill="#c2af9e"/><polygon points="145,22 200,42 200,88 145,108" fill="#6f37a5"/><text x="173" y="70" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">BNL</text></g><path d="M1115 260 V365 H1265" stroke="#356bb8" stroke-width="4" fill="none"/><path d="M1260 355 V520" stroke="#356bb8" stroke-width="4" fill="none"/><path d="M1260 355 H1350" stroke="#356bb8" stroke-width="4" marker-end="url(#arr)"/><path d="M1260 520 H1350" stroke="#356bb8" stroke-width="4" marker-end="url(#arr)"/><rect x="1348" y="325" width="16" height="220" rx="6" fill="#4978c7"/><path d="M1364 435 H1410" stroke="#f07b39" stroke-width="4" marker-end="url(#arr)"/><text x="1405" y="390" text-anchor="middle" font-size="20" font-weight="700" fill="#12233a">Predicted</text><text x="1405" y="417" text-anchor="middle" font-size="20" font-weight="700" fill="#12233a">gaze vector</text></g></svg>